<!-- The desk: your bankers chosen before each race and judged after it, one
     race at a time. desk-page.js, docs/banker-review.md. Behind the Bets
     password: these are your bets and your reasons. -->
<div class="bet-strip" id="desk-strip">
  <div class="bet-brand">
    <span class="dot"></span>DESK
    <span class="sub">YOUR BANKERS, BEFORE AND AFTER</span>
  </div>
  <div class="seg" id="view-toggle" role="group" aria-label="View"></div>
  <div id="book"></div>
</div>

<section id="view-tonight">

</section>
