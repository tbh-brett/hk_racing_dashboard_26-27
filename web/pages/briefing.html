<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briefing</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/pages.css">
<link rel="stylesheet" href="../assets/briefing.css">
<link rel="stylesheet" href="../assets/background.css">
<link rel="stylesheet" href="../assets/briefing-after.css">
<!-- every module this page imports, asked for at once (tests/test_web_preload.py keeps the list true) -->
<link rel="modulepreload" href="../assets/api.js">
<link rel="modulepreload" href="../assets/background.js">
<link rel="modulepreload" href="../assets/book-origin.js">
<link rel="modulepreload" href="../assets/briefing-background.js">
<link rel="modulepreload" href="../assets/briefing-desk.js">
<link rel="modulepreload" href="../assets/briefing-format.js">
<link rel="modulepreload" href="../assets/briefing-model.js">
<link rel="modulepreload" href="../assets/briefing-phone.js">
<link rel="modulepreload" href="../assets/briefing-record.js">
<link rel="modulepreload" href="../assets/briefing-unseen.js">
<link rel="modulepreload" href="../assets/briefing.js">
<link rel="modulepreload" href="../assets/context.js">
<link rel="modulepreload" href="../assets/overlay.js">
<link rel="modulepreload" href="../assets/palette.js">
<link rel="modulepreload" href="../assets/vocab.js">
</head>
<body>

<!-- Layer 1. Rendered by context.js and identical on every page; no page
     writes into it. See design brief 08 §1. -->
<div class="chrome-meeting"></div>

<nav class="chrome-nav" id="nav"></nav>

<!-- BRIEFING · every source, in or due · price capture times. -->
<div class="bf-bar" id="bf-bar"></div>

<!-- Race day only: the race running, the next off, how much of the card has
     run, how old the prices are. -->
<div class="bf-now" id="bf-now" hidden></div>

<div class="bf-stage" id="bf-stage"></div>
<div class="bf-status" id="bf-status">Reading the card…</div>

<!-- Worth studying first, then the rest in race order. Desktop and phone read
     the same view; the stylesheet shows one. -->
<main class="bf-page">
  <section class="bf-desk" id="bf-desk"></section>
  <section class="bf-phone" id="bf-phone"></section>

  <section class="bf-panels" id="bf-panels"></section>

  <!-- Every source's record this season: its top pick and every horse it
       named, beside the tote favourite and the Screen. briefing-record.js. -->
  <section class="bf-record" id="bf-record"></section>

  <!-- Where the imports came from — agent, country, sale, trial — and how
       each kind ran. briefing-background.js. -->
  <section class="bf-record" id="bf-bgrec"></section>

  <div class="bf-legend">
    <span><span class="bf-kind k-screen">SCREEN</span> computed from the card</span>
    <span><span class="bf-kind k-tip">SAID</span> a source said it</span>
    <span><span class="bf-kind k-price">PRICE</span> a market priced it</span>
    <span><span class="bf-mark k-pick">RTW #2</span> pick and rank</span>
    <span><span class="bf-mark k-feat">FC FEAT</span> featured</span>
    <span><span class="bf-mark k-voice">INT J</span> jockey / trainer spoke</span>
    <span><span class="bf-mark k-shown">BRY</span> shown, not counted</span>
    <span>~ heard via speech-to-text</span>
    <span class="dim" id="bf-fit"></span>
  </div>
</main>

<script type="module" src="../assets/briefing.js"></script>
</body>
</html>
