[project]
name = "hkrd"
version = "0.1.0"
description = "Hong Kong racing analytics — dashboard and derive pipeline"
requires-python = ">=3.11"

# sqlite3 is stdlib. The database needs no driver dependency.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# openpyxl is needed ONLY by jobs/migrate_legacy.py, which runs once.
# It must never appear on a hot path — see AGENTS.md, Data rules.
migrate = ["openpyxl>=3.1"]
# playwright is needed ONLY by jobs/scrape_odds, because the odds are
# rendered by JavaScript and no plain HTTP fetch can see them. An extra
# rather than a dependency: it pulls a ~400MB browser, and every other
# page in the dashboard works without it.
#     pip install -e ".[odds]" && playwright install chromium
odds = ["playwright>=1.40"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hkrd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
