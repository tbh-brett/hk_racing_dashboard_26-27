# fly.toml app configuration file generated for new-hk-racing-dashboard on 2026-09-02T09:39:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'new-hk-racing-dashboard'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  HKRD_DB = '/data/hkrd.db'
  HKRD_HOST = '0.0.0.0'
  HKRD_PORT = '8080'
  TZ = 'Asia/Hong_Kong'

[[mounts]]
  source = 'hkrd_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
